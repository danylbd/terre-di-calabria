name: Compila gioco e installer

# Un solo job su Windows: esporta il gioco, crea il Setup e (solo su main) pubblica la Release.
# Niente artifact intermedi: non si usa lo spazio di archiviazione di Actions.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  compila:
    name: Esporta il gioco e crea il Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica Godot e i modelli di esportazione
        shell: pwsh
        run: |
          $V = "$env:GODOT_VERSION-stable"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_win64.exe.zip" -OutFile godot.zip -MaximumRetryCount 5 -RetryIntervalSec 5
          Expand-Archive godot.zip -DestinationPath "$env:RUNNER_TEMP/godot_bin"
          # il Godot «console» va lasciato accanto all'eseguibile vero, con il suo nome: lo cerca lì
          $exe = Get-ChildItem "$env:RUNNER_TEMP/godot_bin" -Filter "*_console.exe" -Recurse | Select-Object -First 1
          "GODOT=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Godot: $($exe.FullName)"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz" -OutFile templates.zip -MaximumRetryCount 5 -RetryIntervalSec 5
          $D = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $D | Out-Null
          Expand-Archive templates.zip -DestinationPath tpl
          Copy-Item tpl\templates\windows_release_* $D
          Copy-Item tpl\templates\version.txt $D
          Remove-Item -Recurse -Force tpl, templates.zip, godot.zip

      - name: Importa il progetto
        shell: pwsh
        run: |
          & $env:GODOT --headless --path . --import
          exit 0

      - name: Esegue tutte le suite di gioco
        shell: pwsh
        run: |
          $tests = Get-ChildItem tools/test -Filter "test_*.gd" | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "Eseguo $($test.Name)"
            & $env:GODOT --headless --path . --script $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Esporta
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/arm64, build/x64 | Out-Null
          & $env:GODOT --headless --path . --export-release "Windows ARM64" build/arm64/TerreDiCalabria.exe
          & $env:GODOT --headless --path . --export-release "Windows x64" build/x64/TerreDiCalabria.exe
          foreach ($f in "build/arm64/TerreDiCalabria.exe", "build/arm64/TerreDiCalabria.pck", "build/x64/TerreDiCalabria.exe", "build/x64/TerreDiCalabria.pck") {
            if (-not (Test-Path $f)) { Write-Error "Manca $f"; exit 1 }
          }
          Get-ChildItem build -Recurse | Format-Table FullName, Length

      - name: Installa Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compila il wizard
        id: wizard
        shell: pwsh
        run: |
          $ver = (Select-String -Path project.godot -Pattern 'config/version="(.+)"').Matches[0].Groups[1].Value
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}", "$env:ProgramFiles" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*Inno Setup*' } | Select-Object -First 1
          Write-Host "Uso $($iscc.FullName) per la versione $ver"
          & $iscc.FullName "/DAppVersion=$ver" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "versione=$ver" >> $env:GITHUB_OUTPUT

      - name: Pubblica la versione (solo per main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.wizard.outputs.versione }}
          target_commitish: ${{ github.sha }}
          name: Terre di Calabria ${{ steps.wizard.outputs.versione }}
          make_latest: true
          body: |
            Installa con **TerreDiCalabria-Setup-${{ steps.wizard.outputs.versione }}.exe** (Windows ARM64 nativo, oppure x64).
            Novità: vedi docs/roadmap.md.
          files: installer/Output/*.exe

  # Scrive l'esito (e, se fallisce, le righe d'errore) nel ramo ci-esito: così si legge con git, senza aprire GitHub.
  esito:
    name: Scrive l'esito nel ramo ci-esito
    needs: compila
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Esito e righe d'errore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir esito && cd esito
          git init -q -b ci-esito
          {
            echo "esito: ${{ needs.compila.result }}"
            echo "commit: ${{ github.sha }}"
            echo "esecuzione: ${{ github.run_number }} (${{ github.event_name }})"
            echo "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ "${{ needs.compila.result }}" != "success" ]; then
              gh run view ${{ github.run_id }} --repo ${{ github.repository }} --log-failed 2>&1 | tail -n 150 || true
            fi
          } > esito.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add esito.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Esito della compilazione ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-esito
